name: Build GlassTalk APK

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

env:
  APP_NAME: "GlassTalk"
  APP_ID: "com.glasstalk.app"
  APP_DIR: "capacitor-apk"

jobs:
  build:
    name: Build GlassTalk Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: '20'

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Prepare Capacitor project
        shell: bash
        run: |
          set -euo pipefail
          INDEX="$(find "$GITHUB_WORKSPACE" -type f -path '*/public/index.html' -not -path '*/node_modules/*' -not -path "*/$APP_DIR/*" -print -quit)"
          if [ -z "$INDEX" ]; then
            echo "::error::Nie znaleziono public/index.html w repozytorium. Wgraj do repo pliki komunikatora (folder public)."
            find "$GITHUB_WORKSPACE" -maxdepth 3 -type f -not -path '*/.git/*' | head -50
            exit 1
          fi
          PUB="$(dirname "$INDEX")"
          echo "Znaleziono aplikacje: $PUB"
          mkdir -p "$APP_DIR/www"
          cp -r "$PUB"/. "$APP_DIR/www/"
          cd "$APP_DIR"
          cat > package.json <<EOF
          {
            "name": "glasstalk-app",
            "version": "1.0.0",
            "private": true,
            "dependencies": {
              "@capacitor/android": "^6.2.0",
              "@capacitor/core": "^6.2.0",
              "@capacitor/filesystem": "^6.0.0",
              "@capacitor/share": "^6.0.0"
            },
            "devDependencies": {
              "@capacitor/cli": "^6.2.0"
            }
          }
          EOF
          cat > capacitor.config.json <<EOF
          {
            "appId": "$APP_ID",
            "appName": "$APP_NAME",
            "webDir": "www",
            "server": {
              "cleartext": true
            },
            "android": {
              "allowMixedContent": true
            }
          }
          EOF
          node -e "JSON.parse(require('fs').readFileSync('package.json'));JSON.parse(require('fs').readFileSync('capacitor.config.json'));console.log('Konfiguracja OK')"
          ls -la www

      - name: Install Android SDK
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager 2>/dev/null | sort -V | tail -n 1)"
          if [ -z "$SDKMANAGER" ]; then SDKMANAGER="$(command -v sdkmanager || true)"; fi
          if [ -z "$SDKMANAGER" ]; then
            echo "::error::Nie znaleziono Android SDK Manager."
            exit 1
          fi
          yes | "$SDKMANAGER" --sdk_root="$SDK_ROOT" --licenses || true
          "$SDKMANAGER" --sdk_root="$SDK_ROOT" "platform-tools" "platforms;android-34" "build-tools;34.0.0"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"

      - name: Create Android project
        shell: bash
        working-directory: ${{ env.APP_DIR }}
        run: |
          set -euo pipefail
          npm install --no-audit --no-fund
          npx cap add android
          MAN=android/app/src/main/AndroidManifest.xml
          grep -q usesCleartextTraffic "$MAN" || sed -i 's/<application/<application android:usesCleartextTraffic="true"/' "$MAN"
          npx cap sync android

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Build APK
        shell: bash
        working-directory: ${{ env.APP_DIR }}/android
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace assembleDebug

      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail
          APK="$(find "$APP_DIR/android" -type f -path '*/build/outputs/apk/debug/*.apk' -print -quit)"
          if [ -z "$APK" ]; then
            echo "::error::Nie znaleziono wygenerowanego APK."
            exit 1
          fi
          mkdir -p output
          cp "$APK" output/GlassTalk.apk
          ls -lh output/GlassTalk.apk

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: GlassTalk-APK
          path: output/GlassTalk.apk
          if-no-files-found: error
          retention-days: 14

name: Build GlassTalk APK

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

env:
  APP_NAME: "GlassTalk"
  APP_ID: "com.glasstalk.app"
  APP_DIR: "capacitor-apk"

jobs:
  build:
    name: Build GlassTalk Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: '20'

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Prepare Capacitor project
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$APP_DIR/www"
          cd "$APP_DIR"
          cat > www/index.html <<'EOF'
          <!doctype html><meta charset="utf-8"><title>GlassTalk</title>
          EOF
          cat > package.json <<'EOF'
          {
            "name": "glasstalk-app",
            "version": "1.0.0",
            "private": true,
            "dependencies": {
              "@capacitor/android": "^6.2.0",
              "@capacitor/core": "^6.2.0"
            },
            "devDependencies": {
              "@capacitor/cli": "^6.2.0"
            }
          }
          EOF
          cat > capacitor.config.json <<EOF
          {
            "appId": "$APP_ID",
            "appName": "$APP_NAME",
            "webDir": "www",
            "overrideUserAgent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/138.0.0.0 Safari/537.36",
            "server": {
              "url": "https://www.facebook.com/messages",
              "allowNavigation": ["facebook.com", "*.facebook.com", "*.messenger.com", "*.fbcdn.net", "*.fbsbx.com"]
            }
          }
          EOF
          node -e "JSON.parse(require('fs').readFileSync('package.json'));JSON.parse(require('fs').readFileSync('capacitor.config.json'));console.log('Konfiguracja OK')"

      - name: Install Android SDK
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager 2>/dev/null | sort -V | tail -n 1)"
          if [ -z "$SDKMANAGER" ]; then SDKMANAGER="$(command -v sdkmanager || true)"; fi
          if [ -z "$SDKMANAGER" ]; then
            echo "::error::Nie znaleziono Android SDK Manager."
            exit 1
          fi
          yes | "$SDKMANAGER" --sdk_root="$SDK_ROOT" --licenses || true
          "$SDKMANAGER" --sdk_root="$SDK_ROOT" "platform-tools" "platforms;android-34" "build-tools;34.0.0"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"

      - name: Create Android project
        shell: bash
        working-directory: ${{ env.APP_DIR }}
        run: |
          set -euo pipefail
          npm install --no-audit --no-fund
          npx cap add android
          npx cap sync android
          PKG_DIR="android/app/src/main/java/$(echo "$APP_ID" | tr . /)"
          mkdir -p "$PKG_DIR" android/app/src/main/assets
          cat > "$PKG_DIR/MainActivity.java" <<'EOF'
          package com.glasstalk.app;

          import android.content.Intent;
          import android.net.Uri;
          import android.os.Bundle;
          import android.provider.DocumentsContract;
          import android.webkit.CookieManager;
          import android.webkit.JavascriptInterface;
          import android.webkit.WebView;
          import androidx.activity.result.ActivityResultLauncher;
          import androidx.activity.result.contract.ActivityResultContracts;
          import com.getcapacitor.BridgeActivity;
          import com.getcapacitor.BridgeWebViewClient;
          import java.io.ByteArrayOutputStream;
          import java.io.IOException;
          import java.io.InputStream;
          import java.io.OutputStream;
          import java.net.URL;

          public class MainActivity extends BridgeActivity {
            private String kind = "m";
            private ActivityResultLauncher<Uri> picker;

            @Override
            public void onCreate(Bundle b) {
              picker = registerForActivityResult(new ActivityResultContracts.OpenDocumentTree(), uri -> {
                if (uri == null) return;
                getContentResolver().takePersistableUriPermission(uri,
                    Intent.FLAG_GRANT_READ_URI_PERMISSION | Intent.FLAG_GRANT_WRITE_URI_PERMISSION);
                getPreferences(0).edit().putString(kind, uri.toString()).remove("mfile").apply();
                getBridge().getWebView().evaluateJavascript("window.__gtr&&window.__gtr()", null);
              });
              super.onCreate(b);
              WebView w = getBridge().getWebView();
              CookieManager.getInstance().setAcceptThirdPartyCookies(w, true);
              w.addJavascriptInterface(this, "GT");
              String js = "";
              try (InputStream in = getAssets().open("gt.js")) {
                ByteArrayOutputStream bo = new ByteArrayOutputStream();
                byte[] buf = new byte[4096];
                int n;
                while ((n = in.read(buf)) > 0) bo.write(buf, 0, n);
                js = bo.toString("UTF-8");
              } catch (Exception e) { }
              final String code = js;
              getBridge().setWebViewClient(new BridgeWebViewClient(getBridge()) {
                @Override
                public void onPageFinished(WebView v, String u) {
                  super.onPageFinished(v, u);
                  v.evaluateJavascript(code, null);
                }
              });
            }

            private Uri dir(String k) {
              String s = getPreferences(0).getString(k, null);
              if (s == null) return null;
              Uri t = Uri.parse(s);
              return DocumentsContract.buildDocumentUriUsingTree(t, DocumentsContract.getTreeDocumentId(t));
            }

            private Uri create(String k, String mime, String name) throws IOException {
              Uri d = dir(k);
              Uri f = d == null ? null : DocumentsContract.createDocument(getContentResolver(), d, mime, name);
              if (f == null) throw new IOException("no folder");
              return f;
            }

            @JavascriptInterface
            public String name(String k) {
              String s = getPreferences(0).getString(k, null);
              if (s == null) return "";
              String n = String.valueOf(Uri.parse(s).getLastPathSegment());
              return n.substring(n.indexOf(':') + 1);
            }

            @JavascriptInterface
            public void pick(String k) {
              runOnUiThread(() -> { kind = k; picker.launch(null); });
            }

            @JavascriptInterface
            public void text(String line) {
              new Thread(() -> {
                try {
                  String fu = getPreferences(0).getString("mfile", null);
                  OutputStream o = null;
                  if (fu != null) {
                    try { o = getContentResolver().openOutputStream(Uri.parse(fu), "wa"); } catch (Exception e) { o = null; }
                  }
                  if (o == null) {
                    Uri f = create("m", "text/plain", "usuniete_wiadomosci.txt");
                    getPreferences(0).edit().putString("mfile", f.toString()).apply();
                    o = getContentResolver().openOutputStream(f, "wa");
                  }
                  o.write((line + "\n").getBytes("UTF-8"));
                  o.close();
                } catch (Exception e) { }
              }).start();
            }

            @JavascriptInterface
            public void url(String u, String file) {
              new Thread(() -> {
                try (InputStream in = new URL(u).openStream(); OutputStream o = getContentResolver().openOutputStream(create("p", "image/jpeg", file))) {
                  byte[] buf = new byte[8192];
                  int n;
                  while ((n = in.read(buf)) > 0) o.write(buf, 0, n);
                } catch (Exception e) { }
              }).start();
            }
          }
          EOF
          cat > android/app/src/main/assets/gt.js <<'EOF'
          (()=>{
          if(window.__gt||!window.GT)return;window.__gt=1;
          const LS=(k,d)=>{try{return JSON.parse(localStorage.getItem(k))??d}catch{return d}},sv=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch{}};
          const el=(t,c,x,p)=>{const e=document.createElement(t);if(c)e.className=c;if(x!=null)e.textContent=x;if(p)p.append(e);return e};
          const vm=document.querySelector('meta[name=viewport]')||el('meta','',null,document.head);vm.name='viewport';vm.content='width=device-width,initial-scale=1';

          /* ===== Liquid Glass ===== */
          const V='--card-background,--card-background-flat,--surface-background,--web-wash,--wash,--comment-background,--messenger-card-background,--nav-bar-background,--nav-bar-background-gradient-wash,--secondary-button-background,--input-background';
          el('style','',`
          html,html[class]{color-scheme:dark;${V.split(',').map(v=>v+':rgba(255,255,255,.08)!important').join(';')};
          --primary-text:#fff!important;--secondary-text:rgba(235,242,255,.75)!important;--primary-icon:#fff!important;--secondary-icon:rgba(235,242,255,.75)!important;--divider:rgba(255,255,255,.16)!important;--hover-overlay:rgba(255,255,255,.12)!important}
          body{background:radial-gradient(60% 50% at 15% 10%,#3a7bff88,transparent),radial-gradient(50% 50% at 90% 85%,#b45cff77,transparent),linear-gradient(160deg,#07122b,#12285a) fixed!important}
          [role=main],[role=navigation],[role=complementary],[role=banner]{backdrop-filter:blur(22px) saturate(1.9)!important;-webkit-backdrop-filter:blur(22px) saturate(1.9)!important;box-shadow:inset 0 1px 0 rgba(255,255,255,.4),0 12px 40px rgba(0,0,0,.28)!important;border-radius:22px}
          .gt-f,.gt-p{position:fixed;z-index:2147483647;color:#fff;font:15px/1.4 system-ui,sans-serif;background:rgba(20,32,70,.55);backdrop-filter:blur(22px) saturate(1.9);-webkit-backdrop-filter:blur(22px) saturate(1.9);box-shadow:inset 0 1px 0 rgba(255,255,255,.5),0 10px 30px rgba(0,0,0,.35);border:1px solid rgba(255,255,255,.25)}
          .gt-f{right:10px;bottom:90px;width:46px;height:46px;border-radius:50%;font-size:20px;cursor:pointer}
          .gt-p{inset:8% 6%;border-radius:30px;padding:18px;overflow:auto;display:flex;flex-direction:column;gap:10px}
          .gt-p[hidden]{display:none}
          .gt-p h3{margin:6px 0 0;font-size:16px}
          .gt-b{color:#fff;font:inherit;padding:12px 16px;border-radius:999px;border:1px solid rgba(255,255,255,.3);background:rgba(255,255,255,.16);cursor:pointer}
          .gt-r{padding:8px 12px;border-radius:16px;background:rgba(255,255,255,.08);overflow-wrap:anywhere}
          .gt-d{color:#ff9aa8;padding:4px 12px;font-size:14px;overflow-wrap:anywhere}`,document.head);

          /* ===== archiwum usuniętych ===== */
          const DEL=/(unsent (a|this) message|usun[a-zęąłó]*\s+wiadomość|cofn[a-zęąłó]*\s+wysłanie\s+wiadomości|wiadomość (została )?(usunięta|cofnięta))\.?$/i;
          let store=LS('gt_s',{}),del=LS('gt_d',[]),ph=new Set(LS('gt_p',[])),seen=new WeakMap(),tm,last=0;
          const txt=r=>{const a=[...r.querySelectorAll('[dir=auto]')].map(e=>e.innerText).join(' ').replace(/\s+/g,' ').trim();return a||''};
          const isDel=t=>t.length<70&&DEL.test(t);
          const flush=()=>{if(!GT.name('m'))return;let n=0;del.forEach(d=>{if(!d.f){d.f=1;n++;GT.text('['+d.time+'] '+d.c+' | '+d.t.replace(/\n/g,' '))}});if(n)sv('gt_d',del)};
          function mark(r,o,c){
            el('div','gt-d','🗑 '+o,r);
            if(!del.some(d=>d.k===c+'|'+o)){del.push({k:c+'|'+o,c:(document.querySelector('[role=main] h2')||{}).innerText||c,t:o,time:new Date().toLocaleString('pl'),f:0});if(del.length>500)del.shift();sv('gt_d',del)}
          }
          function photos(){
            if(!GT.name('p'))return;
            document.querySelectorAll('[role=main] [role=row] img').forEach(i=>{
              const u=i.src||'',k=u.split('?')[0];
              if(i.naturalWidth<200||ph.has(k)||!/fbcdn|fbsbx/.test(u))return;
              ph.add(k);sv('gt_p',[...ph].slice(-3000));GT.url(u,'fb_'+Date.now()+'_'+ph.size+'.jpg');
            });
          }
          function scan(){
            const c=location.pathname,rs=[...document.querySelectorAll('[role=main] [role=row]')],T=rs.map(txt);
            rs.forEach((r,i)=>{
              const t=T[i];if(!t)return;
              const k=c+'\u0001'+(T[i-1]||'').slice(0,40)+'\u0001'+(T[i+1]||'').slice(0,40);
              if(!isDel(t)){seen.set(r,t);store[k]=t}
              else if(!r.querySelector('.gt-d')){
                const o=seen.get(r)||store[k];
                if(o&&!isDel(o))mark(r,o,c);
              }
            });
            const ks=Object.keys(store);if(ks.length>3000)ks.slice(0,ks.length-3000).forEach(k=>delete store[k]);
            if(Date.now()-last>5000){last=Date.now();sv('gt_s',store)}
            flush();photos();
          }
          new MutationObserver(()=>{clearTimeout(tm);tm=setTimeout(scan,700)}).observe(document.body,{childList:true,subtree:true,characterData:true});
          document.addEventListener('visibilitychange',()=>sv('gt_s',store));
          setTimeout(scan,1500);

          /* ===== panel ===== */
          const fab=el('button','gt-f','🗑',document.body),pan=el('div','gt-p',null,document.body);pan.hidden=true;
          function draw(){
            pan.textContent='';el('h3','','Archiwum usuniętych',pan);
            [['m','Wiadomości'],['p','Zdjęcia']].forEach(([k,n])=>{el('button','gt-b',n+': '+(GT.name(k)||'wybierz folder'),pan).onclick=()=>GT.pick(k)});
            el('h3','','Usunięte wiadomości ('+del.length+')',pan);
            del.slice(-50).reverse().forEach(d=>el('div','gt-r',d.time+' · '+d.c+': '+d.t,pan));
            el('button','gt-b','Zamknij',pan).onclick=()=>pan.hidden=true;
          }
          fab.onclick=()=>{pan.hidden=!pan.hidden;if(!pan.hidden)draw()};
          window.__gtr=()=>{if(!pan.hidden)draw();scan()};
          })();
          EOF
          grep -q "GT.pick" android/app/src/main/assets/gt.js && grep -q "OpenDocumentTree" "$PKG_DIR/MainActivity.java"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Build APK
        shell: bash
        working-directory: ${{ env.APP_DIR }}/android
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace assembleDebug

      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail
          APK="$(find "$APP_DIR/android" -type f -path '*/build/outputs/apk/debug/*.apk' -print -quit)"
          if [ -z "$APK" ]; then
            echo "::error::Nie znaleziono wygenerowanego APK."
            exit 1
          fi
          mkdir -p output
          cp "$APK" output/GlassTalk.apk
          ls -lh output/GlassTalk.apk

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: GlassTalk-APK
          path: output/GlassTalk.apk
          if-no-files-found: error
          retention-days: 14
